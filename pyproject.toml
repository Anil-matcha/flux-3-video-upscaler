[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-3-video-upscaler-api"
version = "0.1.0"
authors = [
  { name="Anil Matcha" },
]
description = "Python wrapper for Black Forest Labs' FLUX 3 Video Upscaler API -- upscale FLUX 3 (or any) video output beyond its native resolution."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "python-dotenv",
    "mcp[cli]"
]

[tool.setuptools]
py-modules = ["flux3_video_upscaler_api", "mcp_server"]
